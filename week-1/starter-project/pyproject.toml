[project]
name = "incidentops-starter"
version = "0.1.0"
description = "Proyecto semilla IncidentOps para Semana 1 de Ingeniería de Software Asistida por IA (ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "pydantic>=2.14.4",
    "tiktoken>=0.8.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

